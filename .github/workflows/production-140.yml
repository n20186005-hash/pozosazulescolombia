name: Capture published Boyacá home and guide layouts
on:
  push:
    branches: ['verify/140-production-pages-20261124']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --prefix "$RUNNER_TEMP/visual-check" playwright@1.56.1 --no-audit --no-fund
      - run: mkdir -p screens && node .github/capture-140.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: production-140-screenshots, path: screens}
