name: Capture desktop and mobile views of the published Boyacá guide
on:
  push:
    branches: ['verify/140-production-pages-20261124']
permissions:
  contents: read
jobs:
  desktop-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prepare screenshot browser
        run: |
          npm install --prefix "$RUNNER_TEMP/visual-check" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/visual-check/node_modules/.bin/playwright" install chromium --with-deps
      - name: Inspect home and museum on desktop and mobile
        run: mkdir -p screens && node .github/capture-140.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: production-140-screenshots, path: screens}
